<h1>ClickHouse: Option A vs Option B</h1>
<p class="sub">The decision that determines your serving architecture — measured, not argued</p>

<svg viewBox="0 0 1120 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial">
  <defs>
    <marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#8a6d00"/></marker>
    <marker id="d" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">

  </defs>

  <!-- OPTION A -->
  <rect x="20" y="40" width="520" height="248" rx="10" fill="#fffdf5" stroke="#d4a017" stroke-width="2.4"/>
  <text x="40" y="66" font-size="13" font-weight="bold" fill="#7a5c10">OPTION A — query the lake in place</text>
  <text x="40" y="84" font-size="8.8" fill="#8a6d00">No copy. S3 remains the only storage. Start here as a POC.</text>

  <rect x="42" y="98" width="120" height="66" rx="6" fill="#fff8ee" stroke="#FF9900" stroke-width="2"/>
  <text x="102" y="122" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a5200">S3</text>
  <text x="102" y="139" text-anchor="middle" font-size="7.8" fill="#666">Iceberg / Delta</text>
  <text x="102" y="153" text-anchor="middle" font-size="7.8" fill="#666">refined tables</text>

  <line x1="162" y1="131" x2="204" y2="131" stroke="#8a6d00" stroke-width="2.2" marker-end="url(#y)"/>

  <rect x="208" y="98" width="120" height="66" rx="6" fill="#f3e8fd" stroke="#7e3ff2" stroke-width="1.8"/>
  <text x="268" y="122" text-anchor="middle" font-size="9.6" font-weight="bold" fill="#4c1d95">Glue Catalog</text>
  <text x="268" y="139" text-anchor="middle" font-size="7.8" fill="#666">table metadata</text>
  <text x="268" y="153" text-anchor="middle" font-size="7.8" fill="#666">snapshot refs</text>

  <line x1="328" y1="131" x2="370" y2="131" stroke="#8a6d00" stroke-width="2.2" marker-end="url(#y)"/>

  <rect x="374" y="98" width="142" height="66" rx="6" fill="#fff8e1" stroke="#F5C000" stroke-width="2.4"/>
  <text x="445" y="120" text-anchor="middle" font-size="10" font-weight="bold" fill="#3a2c00">ClickHouse</text>
  <text x="445" y="137" text-anchor="middle" font-size="7.7" font-family="monospace" fill="#555">DataLakeCatalog</text>
  <text x="445" y="152" text-anchor="middle" font-size="7.7" fill="#8a6d00">reads S3 per query</text>

  <rect x="42" y="180" width="474" height="94" rx="6" fill="#fff" stroke="#ddd"/>
  <text x="56" y="200" font-size="9.4" font-weight="bold" fill="#1b5e20">✓ No duplicate storage · no sync job · S3 is the only truth</text>
  <text x="56" y="217" font-size="9.4" font-weight="bold" fill="#1b5e20">✓ Always current — no freshness lag</text>
  <text x="56" y="238" font-size="9.4" font-weight="bold" fill="#c62828">✗ No ClickHouse sparse index — only Iceberg partition pruning</text>
  <text x="56" y="255" font-size="9.4" font-weight="bold" fill="#c62828">✗ Cold S3 reads per query · concurrency multiplies S3 requests</text>
  <text x="56" y="270" font-size="8.6" fill="#777">Fine for ad-hoc. Expect it to miss customer-facing SLOs.</text>

  <!-- OPTION B -->
  <rect x="580" y="40" width="520" height="248" rx="10" fill="#f7fff5" stroke="#2e7d32" stroke-width="2.4"/>
  <text x="600" y="66" font-size="13" font-weight="bold" fill="#1b5e20">OPTION B — materialise into MergeTree</text>
  <text x="600" y="84" font-size="8.8" fill="#2e7d32">Duplicate storage, but you get the index. The serving answer.</text>

  <rect x="602" y="98" width="112" height="66" rx="6" fill="#fff8ee" stroke="#FF9900" stroke-width="2"/>
  <text x="658" y="122" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a5200">S3</text>
  <text x="658" y="139" text-anchor="middle" font-size="7.8" fill="#666">system of record</text>
  <text x="658" y="153" text-anchor="middle" font-size="7.8" fill="#666">full history</text>

  <line x1="714" y1="131" x2="754" y2="131" stroke="#2e7d32" stroke-width="2.4" marker-end="url(#d)"/>
  <rect x="756" y="108" width="124" height="46" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="818" y="126" text-anchor="middle" font-size="9" font-weight="bold" fill="#1b5e20">incremental load</text>
  <text x="818" y="141" text-anchor="middle" font-size="7.6" fill="#2e7d32">snapshot watermark</text>
  <line x1="880" y1="131" x2="918" y2="131" stroke="#2e7d32" stroke-width="2.4" marker-end="url(#d)"/>

  <rect x="922" y="98" width="158" height="66" rx="6" fill="#fff8e1" stroke="#F5C000" stroke-width="2.4"/>
